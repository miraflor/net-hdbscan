<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
<title id="t">Tie-invariant simultaneous hierarchy</title>
<desc id="d">Four components connected by equal-weight edges merge simultaneously, producing a multifurcation instead of arbitrary binary intermediate merges.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#222}.edge{stroke:#0b7285;stroke-width:5}.pt{fill:#fff;stroke:#111;stroke-width:3}.tree{stroke:#555;stroke-width:4;fill:none}.guide{stroke:#adb5bd;stroke-width:2;stroke-dasharray:7 7}.head{font-size:25px;font-weight:700}.small{font-size:19px;fill:#444}.lab{font-size:20px;font-weight:600}
</style>
<text class="head" x="110" y="45">one tied edge level</text><text class="head" x="570" y="45">one multifurcation</text>
<line class="edge" x1="100" y1="225" x2="185" y2="130"/><line class="edge" x1="185" y1="130" x2="280" y2="225"/><line class="edge" x1="280" y1="225" x2="365" y2="130"/>
<circle class="pt" cx="100" cy="225" r="12"/><circle class="pt" cx="185" cy="130" r="12"/><circle class="pt" cx="280" cy="225" r="12"/><circle class="pt" cx="365" cy="130" r="12"/>
<text class="lab" x="135" y="160">5</text><text class="lab" x="230" y="160">5</text><text class="lab" x="320" y="160">5</text>
<line class="guide" x1="500" y1="125" x2="835" y2="125"/><text class="small" x="505" y="110">distance = 5</text>
<path class="tree" d="M560 330 V125 M640 330 V125 M720 330 V125 M800 330 V125 M560 125 H800"/>
<text class="lab" x="553" y="365">A</text><text class="lab" x="633" y="365">B</text><text class="lab" x="713" y="365">C</text><text class="lab" x="793" y="365">D</text>
<text class="small" x="95" y="390">No arbitrary A+B, then (A+B)+C, then ... ordering is introduced.</text>
</svg>
